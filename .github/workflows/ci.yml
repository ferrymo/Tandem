name: Engineering checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@10.34.9
      - run: pnpm install --frozen-lockfile
      - run: pnpm local:init
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm db:up
      - run: pnpm db:bootstrap && pnpm db:migrate && pnpm db:check
      - run: pnpm test:integration
      - run: pnpm test:projects
      - run: pnpm test:capabilities
      - run: pnpm test:delivery
      - name: Verify isolated execution and local delivery
        run: |
          docker pull node@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
          pnpm test:execution
      - run: pnpm build
      - run: pnpm test:collaboration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:collaboration:browser
      - name: Start and verify
        run: |
          pnpm start > /tmp/tandem-web.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/api/health/ready; then break; fi
            sleep 1
          done
          pnpm smoke
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-evidence
          path: |
            test-results/
            playwright-report/
      - run: docker compose down
        if: always()
