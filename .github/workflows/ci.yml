name: Engineering checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm local:init
      - run: corepack pnpm format:check
      - run: corepack pnpm check
      - run: corepack pnpm db:up
      - run: corepack pnpm db:bootstrap && corepack pnpm db:migrate && corepack pnpm db:check
      - run: corepack pnpm test:integration
      - run: corepack pnpm build
      - run: corepack pnpm test:collaboration
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: corepack pnpm test:collaboration:browser
      - name: Start and verify
        run: |
          corepack pnpm start > /tmp/tandem-web.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/api/health/ready; then break; fi
            sleep 1
          done
          corepack pnpm smoke
          corepack pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-evidence
          path: |
            test-results/
            playwright-report/
      - run: docker compose down
        if: always()
