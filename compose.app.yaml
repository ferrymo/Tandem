# Development Compose supplement. Local .env passwords are generated by local:init.
# The main compose file publishes PostgreSQL to loopback for host development.
services:
  web:
    build: { context: ., target: web }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tandem_app:${APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-tandem}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-}
      TANDEM_PUBLIC_URL: ${TANDEM_PUBLIC_URL:-http://127.0.0.1:3000}
      TANDEM_IDENTITY_URL: ${TANDEM_IDENTITY_URL:-}
      TANDEM_IDENTITY_ID: ${TANDEM_IDENTITY_ID:-primary}
      TANDEM_IDENTITY_LABEL: ${TANDEM_IDENTITY_LABEL:-协作系统}
      TANDEM_COMMANDER_ACCOUNTS: ${TANDEM_COMMANDER_ACCOUNTS:-}
      TANDEM_IDENTITY_ALLOW_HTTP: ${TANDEM_IDENTITY_ALLOW_HTTP:-false}
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ['/tmp', '/app/apps/web/.next/cache:uid=1000,gid=1000']
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    mem_limit: 768m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    build: { context: ., target: worker }
    environment:
      NODE_ENV: production
      WORKER_DATABASE_URL: postgresql://tandem_worker:${WORKER_PASSWORD}@postgres:5432/${POSTGRES_DB:-tandem}
      WORKER_HEALTH_FILE: /tmp/tandem-worker-id
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ['/tmp']
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    stop_grace_period: 20s
    mem_limit: 512m
    healthcheck:
      test: ['CMD', 'node', 'scripts/worker-health.mjs']
      interval: 15s
      timeout: 5s
      retries: 3
